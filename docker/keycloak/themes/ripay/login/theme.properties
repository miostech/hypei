# Ripay login theme: keeps Keycloak's markup and behaviour, replaces the looks.
# Built on keycloak.v2 so pages we do not style (OTP, errors, password reset)
# still render correctly instead of falling back to unstyled HTML.
parent=keycloak.v2
import=common/keycloak

styles=vendor/patternfly-v5/patternfly.min.css vendor/patternfly-v5/patternfly-addons.css css/styles.css css/ripay.css

locales=pt-BR,en,es,fr,de,it
