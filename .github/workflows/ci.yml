name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest

    # The test harness uses in-memory Mongo repositories and a manual queue,
    # so Postgres is the only service the suite actually needs.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kabrun
          POSTGRES_PASSWORD: kabrun
          POSTGRES_DB: kabrun_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kabrun"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgresql://kabrun:kabrun@localhost:5432/kabrun_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # src/generated is gitignored, so the client has to be built here.
      - run: npm run db:generate

      - run: npm run lint

      - run: npm run typecheck

      # global-setup applies migrations to TEST_DATABASE_URL before the suite.
      - run: npm run test

      - run: npm run build
