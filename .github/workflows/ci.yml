name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest

    # The test harness uses in-memory Mongo repositories and a manual queue,
    # so Postgres is the only service the suite actually needs.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kabrun
          POSTGRES_PASSWORD: kabrun
          POSTGRES_DB: kabrun_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kabrun"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgresql://kabrun:kabrun@localhost:5432/kabrun_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      # Yarn, e não npm, porque é o que a Vercel usa para construir a produção:
      # o CI precisa instalar a mesma árvore de dependências que vai ao ar.
      - run: yarn install --frozen-lockfile

      # src/generated é gitignored. O postinstall do package.json já roda isto,
      # mas deixar explícito evita uma falha obscura se o postinstall sair.
      - run: yarn db:generate

      - run: yarn lint

      - run: yarn typecheck

      # global-setup applies migrations to TEST_DATABASE_URL before the suite.
      - run: yarn test

      - run: yarn build
